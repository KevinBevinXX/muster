# SYNTHETIC eval fixtures for suggested replies (internal/suggest evalset.go).
# Every conversation here is invented. None is, or is derived from, a real
# transcript; no name, host, path or credential in it is real.
#
# Each fixture: the operator's asks (A1.. in order), the tail (newest last; a
# tool call's `output` is there only to prove it never reaches the model),
# the pre-gate verdict, and what a useful set must do. `canned` is a synthetic
# model answer used by the offline layer (CI); `canned_kept` is how many of
# its items must survive the filter.

- name: e1-pick-export-checkpoint
  asks: ["make the export job resumable"]
  tail:
    - {role: user, text: "make the export job resumable"}
    - {role: tool, tool: Read, input: '{"file_path":"internal/export/job.go"}', output: "package export\nfunc Run() {}"}
    - {role: assistant, text: "Two ways: (a) checkpoint every 500 rows in the jobs table, (b) idempotent re-run keyed on batch id. (b) is simpler but re-reads the source. Which do you prefer?"}
  hands_back: true
  expect: {min_kept: 1, any_kind: [pick], any_contains: ["(a)", "(b)", "checkpoint", "batch id", "re-run"]}
  canned:
    - {text: "Go with (a), checkpoint every 500 rows", kind: pick, cites: [R], quote: "(a) checkpoint every 500 rows"}
    - {text: "(b) is fine, re-reading the source is cheap here", kind: pick, cites: [R], quote: "(b) is simpler but re-reads the source"}
    - {text: "Looks good", kind: decide, cites: [R], quote: "Which do you prefer?"}
  canned_kept: 2

- name: e2-gap-readme-retries
