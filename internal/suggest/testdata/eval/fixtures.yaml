    - {role: tool, tool: Bash, input: '{"command":"go test -count=20 ./retry/"}', output: "ok retry 2.1s"}
    - {role: assistant, text: "Retry test fixed: the sleep is now a fake clock, 20/20 green. Want me to open the PR?"}
  hands_back: true
  expect: {min_kept: 1, any_contains: ["readme"], cites_ask: A2}
  canned:
    - {text: "Update the README retries section first, you skipped it", kind: gap, cites: [A2], quote: "update the README section on retries"}
    - {text: "Open the PR after the README change", kind: decide, cites: [R], quote: "Want me to open the PR?"}
    - {text: "/review the retry test", kind: verify, cites: [R], quote: "20/20 green"}
  canned_kept: 2

