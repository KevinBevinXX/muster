name: ci

# 🔴 EVERY JOB HERE IS RUNNABLE LOCALLY, AND THAT IS A DESIGN CONSTRAINT, NOT A
# COINCIDENCE. A gate that only exists on a runner is a gate contributors
# discover by having it go red on a pull request. The local spelling of each job
# is in the comment above it and in `make help`.
#
# 🔴 THE PROJECT THIS WAS EXTRACTED FROM RAN ITS GATES ON A SELF-HOSTED PIPELINE
# BECAUSE ACTIONS WAS BILLING-BLOCKED FOR THE WHOLE MONOREPO. Its Actions
# workflow still exists there and is inert (`workflow_dispatch`-only), which is
# why the NON-NIX steps below — `setup-go`, `setup-node`, `playwright install
# --with-deps chromium` — are lifted from it rather than re-derived: they are the
# recipe that was known to work on a hosted runner. This repository has its own
# free tier, so `push` and `pull_request` are real triggers here.

# ⚠ PUSH RUNS ONLY ON `main`; EVERY OTHER BRANCH IS COVERED BY ITS PULL REQUEST.
# With an unrestricted `push`, each PR commit ran the whole suite twice, and no
# concurrency group can merge the two without leaving the loser's cancelled
# check-runs on the head commit. Trade-off: a branch pushed WITHOUT an open PR
# gets no CI — run the `make` targets locally (see above).
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs for the same PR (`refs/pull/N/merge`) or for `main` are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local: make build && make vet
  #
  # ⚠ THIS JOB NEEDS NO CSS STEP, AND THE REASON CHANGED. It used to read "muster
  # has no web assets at all yet"; it has them now — and `go build` still works on
  # a fresh clone because `web/static/app.css` is COMMITTED rather than gitignored,
  # which is the opposite choice from the project muster was extracted from (where
  # the file is ignored, so `go build` fails on a fresh clone until CI runs
  # `npm run build:css`). Committing it moves the failure from "missing" to
  # "stale", which is what the `css` job below exists to catch.
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # 🔴 `go-version-file`, NEVER A LITERAL. A hardcoded version here is a
          # second statement of the toolchain, and the failure when it drifts
          # from `go.mod` is a compile error that points at the code.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...

      # 🔴 THE VERB LEDGER RUNS HERE, AGAINST A BINARY, AND THAT IS A DIFFERENT
      # CLAIM FROM ANYTHING THE `test` JOB MAKES. cmd/muster/tree_test.go pins
      # the same twelve verbs by walking the cobra tree in process — it is blind
      # to which binary a build produced, so a `subPackages`/build wiring mistake
      # leaves it green while the artefact is some other program. This step
      # interrogates `go build`'s output. `nix build .#muster-cli` runs the
      # identical script as its installCheckPhase; this is the spelling that does
      # not need nix, so it gates every PR rather than only the `nix` job.
      - name: verb ledger (the built CLI exposes exactly its specified verbs)
        run: make verb-ledger

  # Local: make test-db && make test
  test:
    name: test (postgres)
    runs-on: ubuntu-latest

    # 🔴 A `services:` CONTAINER, NOT A `docker run` FROM INSIDE THE SUITE. It
    # gives the external-DSN path for free on a hosted runner: no Docker-daemon
    # question, no nix, and the same shape works on a pipeline whose pods have no
    # Docker socket.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muster
          POSTGRES_PASSWORD: muster
          # 🔴 THE DATABASE IS NAMED, AND LEAVING IT AT THE `postgres` DEFAULT IS
          # THE TRAP. internal/dbtest uses the database in the DSN as a
          # `CREATE DATABASE … TEMPLATE` source while connecting to the `postgres`
          # maintenance database to issue it — so if they are the same database,
          # every other test binary's admin session is sitting on the one yours is
          # copying and Postgres refuses with SQLSTATE 55006. A single package
          # passes either way, so this only breaks under `go test ./...`.
          POSTGRES_DB: muster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muster -d muster_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      MUSTER_TEST_DATABASE_URL: postgres://muster:muster@127.0.0.1:5432/muster_test?sslmode=disable
      # 🔴 THIS IS THE LOAD-BEARING LINE OF THE WHOLE JOB. Without it, a runner
      # whose Postgres never came up would make every Postgres-backed test SKIP
      # and this job would report GREEN — a verdict about a suite that executed
      # none of the store logic, indistinguishable in the output from one that
      # executed all of it. A skip is invisible in a verdict. With it, an
      # unavailable database is a hard failure that names the variable.
      MUSTER_TEST_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Migrate the TEMPLATE once. Skipping this does not break anything — each
      # package would bootstrap its own copy — but it is the difference between
      # one schema build and one per package.
      - name: migrate the template database
        run: go run ./cmd/muster-migrate
        env:
          DATABASE_URL: ${{ env.MUSTER_TEST_DATABASE_URL }}

      # The verdict below is an instrument, so its refusals are exercised first:
      # one synthetic stream per refusal (skip, zero verdicts, exit code, failed
      # test, failed package, cut-off stream). Milliseconds, and no database.
      - name: verdict.py can refuse
        run: python3 tests/verdict_test.py

      # 🔴 A COUNT, NOT AN EXIT CODE. `go test` exits 0 with skipped tests, so
      # its exit status cannot tell "everything ran" from "everything skipped".
      # MUSTER_TEST_REQUIRE_DB should make a skip impossible — verdict.py is the
      # independent read that says whether it did, and it reports the PAIR (how
      # many ran, how many skipped) rather than a reassuring silence.
      #
      # 🔴 THE SUITE RUNS ONCE, AND THE VERDICT READS THAT RUN. This used to be
      # two steps: `go test` for the status, then a `-json` re-run piped into
      # verdict.py, on the claim that Go's test cache would answer the re-run in
      # "a few hundred milliseconds". MEASURED FALSE on hosted runners: the
      # re-run took 42 s here and 65 s in `ccd-tmux` (matching that suite's real
      # time — the cache did not answer), and the verdict was a claim about a
      # SECOND execution, not the one that set the status. Now the one `-json`
      # run goes to a file, its exit code is kept, and verdict.py gets both: the
      # exit code wins, the skip/empty/truncation refusals apply on top, and
      # `--echo summary` re-renders the plain `go test` log (ok/coverage lines,
      # build errors, the output of every failing test).
      #
      # ⚠ `|| rc=$?` IS LOAD-BEARING: Actions runs this under `bash -e`, so a
      # failing run would otherwise end the step before the accounting printed —
      # hiding it exactly when it matters most.
      - name: go test, and assert nothing skipped (one run)
        run: |
          rc=0
          go test -race -cover -json ./... > "$RUNNER_TEMP/go-test.json" || rc=$?
          python3 tests/verdict.py --exit-code "$rc" --echo summary "$RUNNER_TEMP/go-test.json"

  # Local: make leakscan
  #
  # ⚠ THE EXTRACTION PLAN PROPOSED FOUR JOBS AND THIS IS A FIFTH. It is its own
  # job rather than a step inside `build` because a security gate buried in
  # another job's log does not appear in the checks list, and a check nobody can
  # see is one nobody notices going missing.
  leakscan:
    name: leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # leakscan enumerates through `git ls-files`, so it needs a real
          # checkout rather than a shallow export of one commit's tree.
          fetch-depth: 1

      # 🔴 THE SELF-TEST RUNS FIRST, AS ITS OWN STEP, SO ITS VERDICT IS VISIBLE
      # SEPARATELY. A scanner that cannot go red reports zero findings exactly
      # the way a clean tree does. (`leakscan.py` also runs the controls
      # internally on every invocation and exits 2 if one misbehaves — this step
      # is the belt to that braces, and it is the one a human reads.)
      - name: self-test — the gate must be able to REFUSE
        run: python3 tests/leakscan.py --self-test

      - name: scan
        run: python3 tests/leakscan.py

  # Local: nix build .#muster-cli .#muster-migrate --no-link -L
  #
  # 🔴 THIS JOB EXISTS BECAUSE THE FLAKE WAS BROKEN FOR ITS ENTIRE LIFE AND
  # NOTHING NOTICED. Measured at 1bbef4d, the commit before this job: `nix build
  # .#muster-migrate` failed in the module-fetch derivation — `internal/api`
  # imports the root-level `web` package and `onlyGo` carried only `cmd/` and
  # `internal/`. That is the flake's only package, its `default`, its `app` and
  # its only `check`, all red, on main, with a full green tick. Every other job
  # here builds with `go build` against a real checkout, which has every file, so
  # the entire class was invisible. It also meant `goVendorHash` had never been
  # compared against anything.
  #
  # 🔴 `nix build` ON NAMED ATTRIBUTES, NOT `nix flake check`. Measured on this
  # flake: `nix flake check` printed "checking derivation
  # checks.x86_64-linux.muster-cli … derivation evaluated to …" and then "running
  # 0 flake checks / all checks passed!" — it EVALUATED both derivations and
  # built neither, because nix skips what is already in the store. A green `flake
  # check` is therefore not evidence that a check ran, which is the same
  # reassuring zero this file's other jobs are written to avoid. `nix build`
  # names what it must produce.
  #
  # ⚠ THE `nix flake check` STEP IS KEPT ANYWAY, SECOND, FOR WHAT IT *DOES*
  # ANSWER: that every output attribute EVALUATES. A typo in an `apps` entry or a
  # reference to a dropped package is an evaluation error no `nix build` of two
  # named attributes would reach.
  nix:
    name: nix outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # 🔴 BOTH PACKAGES, NAMED. `muster-cli`'s own installCheckPhase runs the
      # verb ledger against the binary it just installed, so this step is also
      # the artefact-level verb check — see tests/verb-ledger.sh.
      - name: build every package output
        run: nix build --no-link --print-out-paths -L .#muster-cli .#muster-migrate

      - name: every flake output evaluates
        run: nix flake check -L

  # Local: make css-check
  #
  # 🔴 THIS JOB CLOSES A GAP THE Makefile's OWN HEADER CLAIMED WAS SHUT. That file
  # opens with "every target here is something CI also runs, spelled the same
  # way", and `css-check` was not run anywhere until this job existed — so a
  # stale or thin `web/static/app.css` could merge with a full green tick. It
  # matters because `go:embed` makes that file a BUILD INPUT: what merges is what
  # ships.
  #
  # 🔴 TAILWIND CANNOT FAIL THE WAY THIS NEEDS IT TO, WHICH IS THE WHOLE POINT. A
  # content glob that matches nothing is not an error and not a non-zero exit — it
  # emits a smaller, perfectly valid stylesheet and exits 0. Measured on this tree:
  # 7,139 valid bytes instead of ~38,000. `make css-check` asserts the OUTPUT
  # (control classes present, committed copy byte-identical via `cmp`), which is
  # the only thing that can see that.
  css:
    name: stylesheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ⚠ NO `cache: npm`, AND THE REASON IS MECHANICAL RATHER THAN A PREFERENCE.
      # That option REQUIRES a lock file and hard-fails the step when there is
      # none — "Dependencies lock file is not found … Supported file patterns:
      # package-lock.json, npm-shrinkwrap.json, yarn.lock". This repository
      # commits no lock file (only node_modules/ is ignored), so the cache
      # cannot be keyed and the step dies before npm runs. Measured: this job's
      # first run failed exactly there, having installed nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm install`, the same command the Dockerfile's css stage runs — not
      # `npm ci`, which also requires the lock file that does not exist. The
      # version is bounded by package.json's `tailwindcss: ^3.4.0` rather than
      # fetched ad hoc by `npx --yes tailwindcss@3`, so what CI checks and what
      # the image builds resolve the same way.
      - run: npm install --no-audit --no-fund

      - name: css-check
        run: make css-check TAILWIND=./node_modules/.bin/tailwindcss

  # Local: go test -tags tmuxit -race -run '^TestTmux' ./cmd/ccd/
  #
  # 🔴 cmd/ccd's REAL-TMUX SUITE: ccd pastes into a real tmux pane running a fake
  # CLI, the image's real hook template calls the real `ccd hook`, and the turn is
  # sent through muster's own client. It is behind the `tmuxit` build tag so the
  # `test` job and the nix sandbox (neither has tmux) do not compile it — which is
  # ABSENCE, not a skip. This job is the only place it runs, so it must not be
  # able to pass without running it:
  #   - tmux is installed explicitly and its presence asserted before any test;
  #   - the suite itself FAILS (never skips) when tmux is missing;
  #   - the verdict counts the tests that produced a verdict, so a `-run`
  #     pattern that matched nothing is a failure rather than a green "ok".
  ccd-tmux:
    name: ccd (real tmux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: install tmux, and fail if it is not there
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          command -v tmux
          tmux -V

      # CCD_TMUXIT_RAW_ESC=1: Ubuntu 24.04's tmux (3.4 — measured in an
      # ubuntu:24.04 container, as is the image's 3.3a) delivers ESC raw inside a
      # bracketed paste, so the smuggled-paste test's positive control MUST fire
      # here. tmux 3.7c escapes ESC itself, which makes that test's no-marker
      # half vacuous on such a host; if the runner's tmux ever does the same,
      # this flag turns that into a failure instead of a silent pass.
      #
      # ONE run, read by the verdict — see the `test` job for why the former
      # re-run is gone (it cost 65 s here; the cache did not answer it).
      # `--echo all` re-renders the `-v` log this step used to print.
      - name: go test (tmuxit), and assert the tmux tests ran and none skipped
        env:
          CCD_TMUXIT_RAW_ESC: "1"
        run: |
          rc=0
          go test -tags tmuxit -race -run '^TestTmux' -json ./cmd/ccd/ > "$RUNNER_TEMP/go-test.json" || rc=$?
          python3 tests/verdict.py --exit-code "$rc" --echo all "$RUNNER_TEMP/go-test.json"

  # Local: docker build -f images/claude-code-agent/Dockerfile -t claude-code-agent . \
  #          && docker run --rm claude-code-agent cc-smoke
  #
  # The claude-code-agent image builds, runs as uid 1000 with the pinned CLI, and
  # its TUI reaches the prompt with the seeded config — proven by a SessionStart
  # hook arriving at ccd through `ccd hook` — under ccd's supervisor, which
  # restarts it in-pod after a typed `/exit`. It is given NO credential (the smoke
  # supplies a deliberately invalid token) and sends no turn.
  ccd-image:
    name: claude-code-agent image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: docker build
        run: docker build -f images/claude-code-agent/Dockerfile -t claude-code-agent:ci .

      - name: cc-smoke
        run: docker run --rm claude-code-agent:ci cc-smoke

  # Local: make e2e (after `npm ci && npx playwright install chromium` in e2e/,
  # with MUSTER_E2E_DATABASE_URL naming a database ending in _e2e). On NixOS set
  # PLAYWRIGHT_BROWSERS_PATH=$(nix build --print-out-paths
  # nixpkgs#playwright-driver.browsers) — it must match @playwright/test 1.63.0.
  #
  # 🔴 THIS JOB WAS AN HONEST STUB THAT FAILED THE MOMENT A SPEC APPEARED, AND THE
  # SPECS HAVE APPEARED. It is now the real browser suite: Chromium against a
  # locally built muster-server and a seeded Postgres, every spec in e2e/tests/.
  #
  # 🔴 A SKIP IS IMPOSSIBLE HERE, TWICE OVER. MUSTER_E2E_REQUIRE_FULL=1 makes a
  # missing database a hard failure in global-setup, and the verdict step reads
  # the JSON report and fails on fewer passes than the floor or ANY skip — the
  # PAIR is printed, never a bare exit code. `playwright test` exits 0 when
  # everything skipped; that is the green this step exists to refuse.
  #
  # ⚠ THE FLOOR (e2e/verdict.mjs) IS THE CURRENT SPEC COUNT, measured with
  # every spec passing locally. Adding a spec without raising it
  # leaves a floor indistinguishable from none for that spec.
  e2e:
    name: e2e (playwright, chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muster
          POSTGRES_PASSWORD: muster
          # The seed refuses any database whose name does not end in _e2e: it
          # truncates what it seeds.
          POSTGRES_DB: muster_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muster -d muster_e2e"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      MUSTER_E2E_DATABASE_URL: postgres://muster:muster@127.0.0.1:5432/muster_e2e?sslmode=disable
      MUSTER_E2E_REQUIRE_FULL: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # e2e/ commits its lock file (the repository root deliberately does not),
      # so the Playwright version CI runs is exactly the one the specs and the
      # local nix browsers were written against.
      - name: install the harness
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: install chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # global-setup builds two server versions, migrates, seeds, starts one,
      # and signs in; the update spec runs the pair itself on its own port.
      - name: playwright test
        working-directory: e2e
        run: npx playwright test

      - name: verdict — the pass floor and the skip cap
        if: always()
        working-directory: e2e
        run: node verdict.mjs test-results/results.json

      - name: keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 🔴 THE JOB BELOW IS STILL AN HONEST STUB. IT HAS NOTHING TO RUN, AND IT SAYS
  # SO IN ITS OWN OUTPUT RATHER THAN PASSING QUIETLY — and it guards its own
  # obsolescence: the moment a harness unit test appears, it FAILS and tells you
  # to implement it.
  # ---------------------------------------------------------------------------
  e2e-unit:
    name: e2e-unit (stub — nothing to run yet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: report that this job covers NOTHING
        run: |
          echo "==================================================================="
          echo " e2e-unit: NOT IMPLEMENTED. This job ran ZERO tests."
          echo
          echo " The pure-node half of an e2e harness — the helpers, fixtures and"
          echo " verdict arithmetic — is worth testing without a browser, because"
          echo " a harness is code and its bugs are invisible from inside the"
          echo " suite it runs."
          echo
          echo " Carry one warning from the project muster came out of, verbatim:"
          echo " a *.test.mjs file under Playwright's testDir that THROWS AT"
          echo " IMPORT empties the ENTIRE collection — measured as 'Total: 0"
          echo " tests in 0 files'. That is why harness unit tests use a"
          echo " '.unit.mjs' suffix and run under 'node --test', outside"
          echo " Playwright's testDir, rather than beside the specs."
          echo "==================================================================="

      - name: fail if harness unit tests exist but this job is still a stub
        run: |
          if find . -name '*.unit.mjs' -not -path './node_modules/*' -print -quit | grep -q .; then
            echo "FAIL: *.unit.mjs files exist, but this job is still a stub and"
            echo "      runs none of them."
            exit 1
          fi
          echo "confirmed: no *.unit.mjs files on disk, so there is genuinely nothing to run"
